name: webhook-events
# Phase D: fired by the Cloudflare Worker via repository_dispatch when a
# Whop webhook arrives. Event types map from Whop event names:
#   payment.succeeded  -> whop_payment_succeeded
#   membership.activated -> whop_membership_activated
on:
  repository_dispatch:
    types:
      - whop_payment_succeeded
      - whop_membership_activated
      - whop_membership_went_invalid
      - whop_payout_completed
      - whop_unknown

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q weasyprint python-docx markdown
      - name: React to event
        env:
          EVENT_TYPE: ${{ github.event.action }}
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_COMPANY_ID: ${{ secrets.WHOP_COMPANY_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python3 engine/react_webhook.py

      - name: Commit event log back
        run: |
          git config user.name "asset-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          git commit -m "bot: webhook event $(date -u +%F)" || echo "nothing to commit"
          git push || echo "push skipped (no changes)"
