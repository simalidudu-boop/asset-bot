name: review-queue
# You comment /approve or /reject on a paid-asset review Issue.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  handle:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '/approve') || contains(github.event.comment.body, '/reject')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q weasyprint python-docx markdown curl_cffi
      - name: Process command
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_COMPANY_ID: ${{ secrets.WHOP_COMPANY_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if echo "${{ github.event.comment.body }}" | grep -q "/approve"; then
            python3 engine/approve_from_issue.py
          else
            python3 engine/reject_from_issue.py
          fi
