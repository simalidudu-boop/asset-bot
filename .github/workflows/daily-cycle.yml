name: daily-asset-cycle
# Phases A+B: topics -> packs -> packaging -> promo media -> publish.
# Free assets go live automatically; paid assets enter the review queue.
on:
  schedule:
    - cron: "0 0,6,12,18 * * *"      # 00:00 / 06:00 / 12:00 / 18:00 UTC
  workflow_dispatch:
    inputs:
      mock:
        description: "Mock mode (no LLM keys needed)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state (topics index, manifest, budgets)
        uses: actions/cache@v4
        with:
          path: state
          key: bot-state-${{ hashFiles('state/*.json', 'state/*.txt') }}
          restore-keys: bot-state-

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg pandoc
          pip install -q weasyprint python-docx markdown

      - name: Run daily cycle
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_COMPANY_ID: ${{ secrets.WHOP_COMPANY_ID }}
          OWN_FORUM_ID: ${{ secrets.OWN_FORUM_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EDGE_URL: ${{ secrets.EDGE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PRODUCT_PAGE_BASE: ${{ secrets.PRODUCT_PAGE_BASE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MOCK: ${{ github.event.inputs.mock == 'true' && '1' || '0' }}
          DRY_RUN: ${{ github.event.inputs.mock == 'true' && '1' || '0' }}
          N_FREE: "1"
          N_PAID: "2"
        run: python3 engine/run_daily.py

      - name: Commit state back (dedupe index, manifest, budgets)
        run: |
          git config user.name "asset-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ out/daily_summary.json 2>/dev/null || true
          git commit -m "bot: state update $(date -u +%F)" || echo "nothing to commit"
          git push || echo "push skipped (no changes)"

      - name: Upload artifacts (deliverables + media)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-assets-${{ github.run_id }}
          path: |
            out/packs/
            out/deliverables/
            out/media/
          retention-days: 7
