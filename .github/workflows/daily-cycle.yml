name: daily-asset-cycle
# Phases A+B: topics -> packs -> packaging -> promo media -> publish.
# Free assets go live automatically; paid assets enter the review queue.
on:
  schedule:
    - cron: "50 7 * * *"     # 06:23 UTC daily — off the top of the hour (audit P2)
  workflow_dispatch:
    inputs:
      mock:
        description: "Mock mode (no LLM keys needed)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if Worker cron already ran this slot
        id: claim
        if: github.event_name == 'schedule'
        env:
          EDGE_URL: https://asset-bot-edge.simalidudu.workers.dev
        run: |
          R=$(curl -sf -X POST "$EDGE_URL/api/cronclaim" \
                -H 'Content-Type: application/json' \
                -d '{"workflow":"daily-cycle"}' || echo '{"claimed":true}')
          echo "claim: $R"
          if echo "$R" | grep -q '"claimed":false'; then
            echo "Worker cron already dispatched this slot - exiting."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.claim.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.claim.outputs.skip != '1'
        with:
          python-version: "3.12"


      - name: Install deps
        if: steps.claim.outputs.skip != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg pandoc
          pip install -q weasyprint python-docx markdown curl_cffi

      - name: Run daily cycle
        if: steps.claim.outputs.skip != '1'
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_APP_API_KEY: ${{ secrets.WHOP_APP_API_KEY }}
          DIST_POSTING_MODE: ${{ secrets.DIST_POSTING_MODE }}
          FILEPOST_API_KEY: ${{ secrets.FILEPOST_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_PAT: ${{ secrets.HASHNODE_PAT }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          DISCORD_PROMO_WEBHOOKS: ${{ secrets.DISCORD_PROMO_WEBHOOKS }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          ITCH_USERNAME: ${{ secrets.ITCH_USERNAME }}
          SELLIX_API_KEY: ${{ secrets.SELLIX_API_KEY }}
          SELLAPP_API_KEY: ${{ secrets.SELLAPP_API_KEY }}
          FETCHAPP_KEY: ${{ secrets.FETCHAPP_KEY }}
          FETCHAPP_TOKEN: ${{ secrets.FETCHAPP_TOKEN }}
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          WEBFLOW_COLLECTION_ID: ${{ secrets.WEBFLOW_COLLECTION_ID }}
          SYSTEMEIO_API_KEY: ${{ secrets.SYSTEMEIO_API_KEY }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          WHOP_APP_ID: ${{ secrets.WHOP_APP_ID }}
          WHOP_COMPANY_ID: ${{ secrets.WHOP_COMPANY_ID }}
          OWN_FORUM_ID: ${{ secrets.OWN_FORUM_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EDGE_URL: ${{ secrets.EDGE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PRODUCT_PAGE_BASE: ${{ secrets.PRODUCT_PAGE_BASE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MOCK_INPUT: ${{ github.event.inputs.mock == 'true' && '1' || '0' }}
          N_FREE: "1"
          N_PAID: "2"
        run: |
          DRY_RUN=0; MOCK=0; export DRY_RUN MOCK
          # pull live config from the Command Center (KV) — Settings tab
          C=$(curl -sf "$EDGE_URL/api/config" || echo '{}')
          for k in N_FREE N_PAID N_IMAGES MAKE_VIDEO PREFLIGHT_STRICT; do
            v=$(echo "$C" | python3 -c "import json,sys;print(json.load(sys.stdin).get('config',{}).get('$k',''))" 2>/dev/null)
            if [ -n "$v" ]; then
              case "$v" in True) v=1;; False) v=0;; esac
              export "$k=$v"; echo "config: $k=$v"
            fi
          done
          S=$(curl -sf "$EDGE_URL/api/status" || echo '{}')
          K=$(echo "$S" | python3 -c "import json,sys;print('1' if json.load(sys.stdin).get('kill') else '0')" 2>/dev/null || echo 0)
          if [ "$K" = "1" ]; then echo "KILL SWITCH ON — aborting run"; exit 0; fi
          D=$(echo "$S" | python3 -c "import json,sys;print('1' if json.load(sys.stdin).get('dry') else '0')" 2>/dev/null || echo 0)
          if [ "$MOCK_INPUT" = "1" ]; then export MOCK=1 DRY_RUN=1; elif [ "$D" = "1" ]; then export DRY_RUN=1; fi
          echo "guard: kill=$K dry=$DRY_RUN mock=$MOCK_INPUT"
          python3 engine/run_daily.py

      - name: Commit state back (dedupe index, manifest, budgets)
        if: steps.claim.outputs.skip != '1'
        run: |
          git config user.name "asset-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ out/daily_summary.json 2>/dev/null || true
          git commit -m "bot: state update $(date -u +%F)" || { echo "nothing to commit"; exit 0; }
          # concurrent bot runs race on state/ — retry rebase+push (audit P11)
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q && git push -q; then
              echo "state pushed (attempt $i)"; exit 0
            fi
            echo "push attempt $i failed — retrying"; git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push state after 5 attempts"; exit 1

      - name: Upload artifacts (deliverables + media)
        uses: actions/upload-artifact@v4
        if: always() && steps.claim.outputs.skip != '1'
        with:
          name: daily-assets-${{ github.run_id }}
          path: |
            out/packs/
            out/deliverables/
            out/media/
          retention-days: 7
